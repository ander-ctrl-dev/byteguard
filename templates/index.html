<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">


  <!-- Styles -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/layout.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/robot.css') }}?v=2">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/animations.css') }}">
</head>

<body class="theme-gold">

  <!-- Header (NOT in head) -->
  <div class="app-header">ByteGuard</div>

  <!-- Main Layout -->
  <div class="app-shell">
    <div class="robot-panel">

    <div class="robot-wrapper">

        <div class="antenna"></div>

        <div class="head">
            <div class="visor">
                <div class="eye left"></div>
                <div class="eye right"></div>
            </div>
        <div class="mouth"></div>
        </div>
        <div class="neck"></div>
        <div class="body"></div>

        <div class="arm left"></div>
        <div class="arm right"></div>

        <div class="leg left"></div>
        <div class="leg right"></div>

    </div>

</div>
    <!-- CENTER: Main Card -->
    <div class="center-panel">
      <div class="panel">

        <p id="mood" class="mood">Mood: neutral</p>
        <p id="response">Hi! I’m Pings 👋

I translate technical systems into
plain English so anyone can understand them.

Try asking about:
networking, diagnostics, weather or internet issues.
</p>

        <input id="user-input" placeholder="Say something..." />
      </div>
    </div>

    <!-- RIGHT: Logs -->
    <div class="right-panel">
      <div class="panel">

        <h3>System Logs</h3>

        <div id="logsBox">
        </div>          
        <button class="diag-btn" onclick="clearLogs()">
        Clear Logs
      </button>
      </div>
    </div>

  </div>

  <!-- JS -->
  <script type="module" src="/static/js/main.js"></script>

</body>
</html>
