<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  

  <!-- Styles -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/layout.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/robot.css') }}?v=2">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/animations.css') }}">
</head>

<body class="theme-gold">

  <!-- Header (NOT in head) -->
  <div class="app-header">ByteGuard</div>

  <!-- Main Layout -->
  <div class="app-shell">
    <div class="robot-panel">

    <div class="robot-wrapper">

        <div class="antenna"></div>

        <div class="head">
            <div class="visor">
                <div class="eye left"></div>
                <div class="eye right"></div>
            </div>
        <div class="mouth"></div>
        </div>
        <div class="neck"></div>
        <div class="body"></div>

        <div class="arm left"></div>
        <div class="arm right"></div>

        <div class="leg left"></div>
        <div class="leg right"></div>

    </div>

</div>
   
    <!-- CENTER: Main Card -->
    <div class="center-panel">
      <div class="panel">

        <p id="moodBox">Mood: neutral</p>

        <p id="response">Hi, I'm Pings</p>

        <input id="user-input" placeholder="Say something..." />
      </div>
    </div>

    <!-- RIGHT: Logs -->
    <div class="right-panel">
      <div class="panel">

        <h3>System Logs</h3>

        <div id="logsBox">
          <div class="log success">✔ Scan complete</div>
          <div class="log warning">⚠ High latency detected</div>
          <div class="log idle">…waiting</div>
        </div>
          <button class="diag-btn" onclick="runDiagnostics()">
            Run Diagnostics
          </button>
      </div>
    </div>

  </div>

  <!-- JS -->
  <script type="module" src="/static/js/main.js"></script>

</body>
</html>
